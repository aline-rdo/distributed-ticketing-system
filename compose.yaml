services:
  frontend:
    deploy:
      resources:
        reservations:
          cpus: "0.20"
          memory: 64M
        limits:
          cpus: "0.30"
          memory: 256M
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_PAYMENT_URL: ${NEXT_PUBLIC_PAYMENT_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  payment-service:
    deploy:
      resources:
        reservations:
          cpus: "0.20"
          memory: 64M
        limits:
          cpus: "0.30"
          memory: 256M
    build:
      context: .
      dockerfile: microservices/payment-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      TICKETS_SERVICE_ADDRESS: tickets-service:8001
      ANALYTICS_SERVICE_ADDRESS: analytics-service:8003
    depends_on:
      tickets-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  tickets-service:
    deploy:
      resources:
        reservations:
          cpus: "0.20"
          memory: 64M
        limits:
          cpus: "0.30"
          memory: 256M
    build:
      context: .
      dockerfile: microservices/tickets-service/Dockerfile
    environment:
      PORT: 8001
      EMAIL_SERVICE_ADDRESS: email-service:8002
      ANALYTICS_SERVICE_ADDRESS: analytics-service:8003
    depends_on:
      email-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const g=require('@grpc/grpc-js'),l=require('@grpc/proto-loader');const h=g.loadPackageDefinition(l.loadSync('/app/proto/health.proto')).grpc.health.v1;const c=new h.Health('127.0.0.1:'+process.env.PORT,g.credentials.createInsecure());c.check({service:''},{deadline:Date.now()+2000},(e,r)=>{c.close();process.exit(e||!r||(r.status!==1&&r.status!=='SERVING')?1:0)})"]
      interval: 5s
      timeout: 3s
      retries: 10

  email-service:
    deploy:
      resources:
        reservations:
          cpus: "0.20"
          memory: 64M
        limits:
          cpus: "0.30"
          memory: 256M
    build:
      context: .
      dockerfile: microservices/email-service/Dockerfile
    environment:
      PORT: 8002
      ANALYTICS_SERVICE_ADDRESS: analytics-service:8003
    depends_on:
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const g=require('@grpc/grpc-js'),l=require('@grpc/proto-loader');const h=g.loadPackageDefinition(l.loadSync('/app/proto/health.proto')).grpc.health.v1;const c=new h.Health('127.0.0.1:'+process.env.PORT,g.credentials.createInsecure());c.check({service:''},{deadline:Date.now()+2000},(e,r)=>{c.close();process.exit(e||!r||(r.status!==1&&r.status!=='SERVING')?1:0)})"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-service:
    deploy:
      resources:
        reservations:
          cpus: "0.20"
          memory: 64M
        limits:
          cpus: "0.30"
          memory: 256M
    build:
      context: .
      dockerfile: microservices/analytics-service/Dockerfile
    environment:
      PORT: 8003
    healthcheck:
      test: ["CMD", "node", "-e", "const g=require('@grpc/grpc-js'),l=require('@grpc/proto-loader');const h=g.loadPackageDefinition(l.loadSync('/app/proto/health.proto')).grpc.health.v1;const c=new h.Health('127.0.0.1:'+process.env.PORT,g.credentials.createInsecure());c.check({service:''},{deadline:Date.now()+2000},(e,r)=>{c.close();process.exit(e||!r||(r.status!==1&&r.status!=='SERVING')?1:0)})"]
      interval: 5s
      timeout: 3s
      retries: 10
