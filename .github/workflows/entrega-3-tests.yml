name: Entrega 3 - Autoscaling por memoria

on:
  push:
    branches: [entrega-3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            microservices/*/package-lock.json
            tests/entrega-1/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar avaliador e scripts existentes
        run: |
          python3 -m unittest discover -s tests/entrega-3 -p test_evaluator.py -v
          python3 -m unittest tests/entrega-2/test_scripts.py -v

      - name: Preservar contratos e comportamento gRPC
        run: |
          npm ci --prefix tests/entrega-1
          for service in analytics-service email-service payment-service tickets-service; do
            npm ci --prefix "microservices/$service"
          done
          npm test --prefix tests/entrega-1

      - name: Instalar Podman, kind e kubectl
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman uidmap slirp4netns
          curl --fail --location --output /tmp/kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo install --mode=0755 /tmp/kind /usr/local/bin/kind
          curl --fail --location --output /tmp/kubectl https://dl.k8s.io/release/v1.33.4/bin/linux/amd64/kubectl
          sudo install --mode=0755 /tmp/kubectl /usr/local/bin/kubectl
          podman info
          kind version
          kubectl version --client

      - name: Criar cluster kind com Podman
        env:
          KIND_EXPERIMENTAL_PROVIDER: podman
        run: >-
          kind create cluster --name cin0143 --wait 60s
          --config tests/entrega-3/kind-config.yaml

      - name: Preparar aplicacao com setup da Entrega 2
        run: python3 tests/entrega-2/setup_k8s.py

      - name: Instalar infraestrutura de metricas fornecida
        run: |
          kubectl apply -f tests/entrega-3/metrics-server.yaml
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s

      - name: Avaliar autoscaling
        run: python3 tests/entrega-3/test_autoscaling.py

      - name: Diagnostico do cluster
        if: always()
        run: |
          kubectl --request-timeout=10s get deployments,pods,hpa || true
          kubectl --request-timeout=10s describe hpa payment-service-hpa || true
          kubectl --request-timeout=10s top pods || true
          kubectl --request-timeout=10s describe pods -l app=payment-service || true
          kubectl --request-timeout=10s describe pods -l app=tickets-service || true
          kubectl --request-timeout=10s get events --sort-by=.lastTimestamp || true
          kubectl --request-timeout=10s logs -l app=payment-service --all-containers --tail=50 --prefix || true
